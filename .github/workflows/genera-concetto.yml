name: Genera Concetto del giorno

on:
  schedule:
    # Ogni giorno alle 6:30 UTC (7:30 in Italia, 8:30 in ora legale)
    - cron: '30 6 * * *'
  workflow_dispatch: {}
    # ↑ Permette anche di lanciarlo a mano dalla scheda "Actions" di GitHub,
    #   utile per testare senza aspettare l'orario programmato.

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Imposta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Genera le edizioni di oggi
        id: genera
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Facoltativa: se il secret non esiste, le foto usano il metodo alternativo
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/generate-concetto.js

      - name: Salva i risultati nel repository
        run: |
          git config user.name "Concetto Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico: edizioni del $(date -u +'%Y-%m-%d')"
          git push

      # Se qualche sezione è rimasta a ieri, il run diventa ROSSO (dopo aver salvato il resto)
      # e GitHub ti manda l'avviso via email.
      - name: Segnala edizione incompleta
        if: steps.genera.outputs.incompleto == 'true'
        run: |
          echo "::error::Alcune sezioni non sono state aggiornate oggi: vedi il riepilogo del run."
          exit 1
